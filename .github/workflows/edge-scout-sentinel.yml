name: WholeTroutMedia Edge Scout & Counter-Bot Sentinel

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  edge-bot-interceptor:
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.comment.user.login != 'jaharoni'
    steps:
      - name: Profile Commenter & Intercept Scraper Slop at GitHub Edge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          cid = os.environ["COMMENT_ID"]
          inum = os.environ["ISSUE_NUMBER"]
          actor = os.environ["ACTOR"]
          body = (os.environ.get("BODY") or "").lower()

          def api(path, method="GET", data=None):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=json.dumps(data).encode() if data else None,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "WholeTroutMedia-EdgeScout/1.0",
                  },
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  raw = r.read().decode()
                  return json.loads(raw) if raw else {}

          slop_signatures = [
              "expensify account email",
              "upwork profile link",
              "please re-state the problem",
              "what is the root cause of that problem",
          ]
          is_bot = any(s in body for s in slop_signatures)
          if not is_bot:
              events = api(f"/users/{actor}/events/public?per_page=20")
              comments = [e for e in events if e.get("type") == "IssueCommentEvent"]
              repos = {(e.get("repo") or {}).get("name") for e in comments}
              if len(comments) >= 8 and len(repos) >= 4:
                  is_bot = True

          if is_bot:
              print(f"[EDGE-SENTINEL] Intercepted automated scraper bot @{actor}; purging comment {cid}")
              api(f"/repos/{repo}/issues/comments/{cid}", method="DELETE")
              api(f"/repos/{repo}/issues/{inum}/lock", method="PUT", data={"lock_reason": "resolved"})
          EOF
