          AUTHOR_HASH=$(printf "%s" "${PR_AUTHOR,,}" | sha256sum | awk '{print $1}')
          SALTED_CI_HASH=$(printf "v2-ci-gate::%s" "${PR_AUTHOR,,}" | sha256sum | awk '{print $1}')
